name: CI

on:
  push:
    branches: [main, feature/multi-agent]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check src/ tests/ --select E,F,W --ignore E501
      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CORAL
        run: pip install -e ".[dev]"

      - name: Install ocean-mcp servers
        run: |
          git clone --depth 1 https://github.com/mansurjisan/ocean-mcp.git /tmp/ocean-mcp
          for server in coops-mcp stofs-mcp nhc-mcp recon-mcp erddap-mcp ofs-mcp \
                        adcirc-mcp goes-mcp schism-mcp usgs-mcp winds-mcp ww3-mcp \
                        ufs-runner-mcp hpc-system-mcp nos-workflow-mcp alert-mcp; do
            if [ -d "/tmp/ocean-mcp/servers/$server" ]; then
              pip install -e "/tmp/ocean-mcp/servers/$server" -q
            fi
          done

      - name: Install science dependencies
        run: pip install matplotlib numpy pandas xarray netCDF4 f90nml

      - name: Run tests
        run: |
          pytest tests/ -v -m "not integration" --tb=short \
            --ignore=tests/test_rag_indexer.py \
            --ignore=tests/test_rag_retriever.py
